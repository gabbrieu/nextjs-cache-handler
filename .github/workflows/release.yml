name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidate
          path: artifacts/
          if-no-files-found: error

# Publication is a separate maintainer operation after package verification and
# registry scope authorization. This workflow has no npm write credential, OIDC
# publishing permission, or inherited MCP publishing path.